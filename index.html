<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Arb Bankroll Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ledger bar (totals + currency + save) over three tabbed sections: Money, Matches, Planner */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f5f8f7; --ink:#14211f; --muted:#5b6b68; --line:#d5dfdc;
  --accent:#0d6b62; --accent-soft:#d9eeea; --accent-ink:#ffffff;
  --good:#1d7a3e; --good-soft:#e1f2e6; --bad:#b4372b; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d6;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172221; --surface-2:#1c2928; --ink:#e3ecea; --muted:#94a6a2; --line:#2a3a38;
  --accent:#3fb8a9; --accent-soft:#163a36; --accent-ink:#06201d;
  --good:#5cc982; --good-soft:#173524; --bad:#f07a6c; --bad-soft:#3a1d19; --warn:#e2b44a; --warn-soft:#352a10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172221; --surface-2:#1c2928; --ink:#e3ecea; --muted:#94a6a2; --line:#2a3a38;
  --accent:#3fb8a9; --accent-soft:#163a36; --accent-ink:#06201d;
  --good:#5cc982; --good-soft:#173524; --bad:#f07a6c; --bad-soft:#3a1d19; --warn:#e2b44a; --warn-soft:#352a10;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.tot{display:flex;gap:18px;flex-wrap:wrap}
.tot div{display:flex;flex-direction:column}
.tot small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tot b{font-family:var(--f-mono);font-weight:600;font-size:15px}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:999px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.save-state{font-size:12px;color:var(--muted);min-width:7ch}
.save-state.dirty{color:var(--warn);font-weight:600}
.tabs{display:flex;gap:4px;border-top:1px solid var(--line)}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a span{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}

main{padding-block:22px 60px}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:800;letter-spacing:-.015em}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{padding:10px 14px;border-radius:8px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.note.good{background:var(--good-soft);color:var(--good)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
input[type=text],input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.in-num{max-width:160px}
.cur-in{position:relative;display:flex;align-items:center}
.cur-in em{position:absolute;left:9px;font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:14px;pointer-events:none}
.cur-in input{padding-left:24px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.lock{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* match cards */
.matches{display:grid;gap:16px}
.match{padding:16px;display:flex;flex-direction:column;gap:14px}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.m-top h3{font-size:17px;font-weight:700}
.m-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.side{display:grid;grid-template-columns:1fr 92px;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.side label,.m-opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.side input{background:var(--surface)}
.vs{align-self:center;font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:13px}
.m-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.calc{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.stakes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stake{padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.stake small{display:block;font-size:12px;color:var(--muted)}
.stake b{font-family:var(--f-mono);font-size:20px;font-weight:600}
.stake .tag{font-size:11px;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-mono);font-weight:600}
.kv .g{color:var(--good)} .kv .x{color:var(--bad)}
.settle{display:flex;gap:8px;flex-wrap:wrap}
.bet-cell{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.bet-cell b{font-weight:600}
table.sides td{vertical-align:middle;width:50%}
table.sides td.voided{opacity:.6}
td.chk,th.chk{width:1%;padding-right:0}
td.chk input,th.chk input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.off td:not(.chk){opacity:.45;text-decoration:line-through}
tr.grp td{background:var(--surface-2);font-size:13px;padding-top:8px;padding-bottom:8px}
tr.grp-safe b{color:var(--good)} tr.grp-risky b{color:var(--bad)} tr.grp-cover b{color:var(--warn)}
.pill.risk{cursor:help}
.xfer .xf-chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}
.xfer li.done{opacity:.7}
.xfer li.done b,.xfer li.done .num{text-decoration:line-through}
.pill.safe{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
button.pill{font:inherit;font-size:12px;font-weight:600;cursor:pointer;border:0}
button.pill.safe{border:1px solid var(--line)}
.bet-edit .cur-in{width:120px}
.bet-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;margin-top:8px}
.bet-add select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:220px}
.bet-add .cur-in{width:130px}
.row-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.quick-acc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.quick-acc>span{flex:1 1 220px}
.quick-acc input[type=text],.quick-acc .cur-in{width:170px;flex:0 1 170px}
table.sides tfoot td{border-top:1px solid var(--line);font-size:13px}
.vs-cell{color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:12px;text-align:center;width:1%}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate-card{width:100%;max-width:340px;padding:24px;display:flex;flex-direction:column;gap:10px}
.gate-card label{font-size:13px;color:var(--muted);margin-top:8px}
.gate-card input{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
.own{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.own-h{grid-column:1/-1;font-size:13px;font-weight:600}
.own-h .muted{font-weight:400}
.own label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-family:var(--f-mono);font-size:13px;font-weight:600}
.chip span{font-family:var(--f-body);font-weight:400;color:var(--good);margin-left:4px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
details.done summary{cursor:pointer;font-weight:600;padding:12px 16px}
details.done .tbl-wrap{border-top:1px solid var(--line)}

/* planner */
.plan{padding:16px;display:flex;flex-direction:column;gap:12px}
.plan h3{font-size:17px}
.plan .meta{color:var(--muted);font-size:13px}
.xfer{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.xfer li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}
.xfer .arrow{color:var(--accent);font-weight:700}
.xfer li{align-items:center}
.xfer .xf-amt{width:130px}
.xfer select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:160px}
.xfer .xf-add{background:transparent;border:1px dashed var(--line)}
.side-a{color:var(--accent);font-weight:600}
.settings{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.log{margin:0;padding:0;list-style:none;font-size:13px}
.log li{padding:7px 16px;border-top:1px solid var(--line);display:flex;gap:12px}
.log time{color:var(--muted);font-family:var(--f-mono);white-space:nowrap}

@media (max-width:640px){
  .tot{gap:12px;width:100%;order:3}
  .m-grid{grid-template-columns:1fr}
  .vs{justify-self:center}
  .m-opts{grid-template-columns:1fr}
  .stakes{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="wrap bar-in">
    <div class="brand"><i></i>Arb Bankroll</div>
    <div class="tot" id="totals"></div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Currency">
        <button id="cur-inr" data-act="cur" data-v="INR" aria-pressed="true">₹</button>
        <button id="cur-usd" data-act="cur" data-v="USD" aria-pressed="false">$</button>
      </div>
      <span class="save-state" id="save-state"></span>
      <button class="btn pri" id="save-btn" data-act="save">Save</button>
    </div>
  </div>
  <nav class="wrap tabs" aria-label="Sections">
    <a href="#money" data-tab="money">Money <span id="cnt-acc"></span></a>
    <a href="#matches" data-tab="matches">Matches <span id="cnt-m"></span></a>
    <a href="#planner" data-tab="planner">Planner</a>
    <a href="#bets" data-tab="bets">Bets <span id="cnt-b"></span></a>
  </nav>
</header>

<div id="gate" class="gate" hidden>
  <form id="gate-form" class="card gate-card">
    <div class="brand"><i></i>Arb Bankroll</div>
    <label for="gate-pw">Password</label>
    <input type="password" id="gate-pw" autocomplete="current-password" required>
    <button class="btn pri" type="submit">Open tracker</button>
    <p id="gate-msg" class="muted" style="margin:0;font-size:13px" role="status"></p>
  </form>
</div>

<main class="wrap">
  <div id="notes" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
  <section id="tab-money"></section>
  <section id="tab-matches" hidden></section>
  <section id="tab-planner" hidden></section>
  <section id="tab-bets" hidden></section>
</main>

<script>
(function(){
const KEY='arb-tracker-v1';
const DOC='tracker/main';
const uid=()=>Math.random().toString(36).slice(2,10);
const r2=x=>Math.round((+x||0)*100)/100;
const ceil2=x=>Math.ceil(x*100-1e-6)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newMatch(n){return{id:uid(),name:'Match '+n,teamA:'',oddsA:'',teamB:'',oddsB:'',maxBet:'',pairs:1,time:'',status:'draft',bets:[],winner:null,profit:0}}
function defaultState(){return{settings:{currency:'INR',rate:93,feeUsd:0.1},accounts:[],matches:[newMatch(1)],log:[],feesPaid:0,matchSeq:1,rev:null}}
function normalize(d){
  const s=Object.assign(defaultState(),d||{});
  s.settings=Object.assign(defaultState().settings,s.settings||{});
  s.accounts=Array.isArray(s.accounts)?s.accounts:[];
  s.matches=Array.isArray(s.matches)?s.matches.map(m=>Object.assign(newMatch(1),m)):[];
  s.log=Array.isArray(s.log)?s.log:[];
  s.matchSeq=Math.max(s.matchSeq||1,s.matches.length);
  return s;
}
const clone=o=>JSON.parse(JSON.stringify(o));

let S=defaultState(), dirty=false, mode='loading', docRef=null, pendingRemote=null, saving=false, saveAgain=false;
let armed=null, armTimer=null, lastPlan=[], tab='money', notes={};
/* planned bets you have unticked are kept on the match (m.unticked = account ids), so every device sees them */
let editingBet=null; // "matchId:betIndex" being edited
const isUnticked=(m,acc)=>Array.isArray(m.unticked)&&m.unticked.includes(acc);

/* ---------- money helpers ---------- */
const isUSD=()=>S.settings.currency==='USD';
const rate=()=>(+S.settings.rate>0?+S.settings.rate:93);
const feeInr=()=>r2((+S.settings.feeUsd||0)*rate());
/* raising a planned transfer = the sender earned that extra (untracked) unless you switch it off */
const extraOf=t=>t&&t.base!=null&&t.earned!==false?Math.max(0,r2(t.amount-t.base)):0;
function sendXfer(t,fee){
  const f=accById(t.from),to=accById(t.to);if(!f||!to)return 0;
  const extra=extraOf(t);
  if(extra){f.balance=r2(f.balance+extra);addLog(`Found ${fmt(extra)} extra in ${f.name} (earned, sent on to ${to.name})`)}
  f.balance=r2(f.balance-t.amount-fee);to.balance=r2(to.balance+t.amount);S.feesPaid=r2((S.feesPaid||0)+fee);
  addLog(`Sent ${fmt(t.amount)} from ${f.name} to ${to.name} (+${fmt(fee)} fee)`);
  return extra;
}
const minXfer=()=>Math.max(0,+S.settings.minXfer||0); // smallest amount one transfer may send, in INR (0 = any)
const toDisp=inr=>isUSD()?inr/rate():inr;
const fromDisp=v=>isUSD()?v*rate():v;
const sym=()=>isUSD()?'$':'₹';
function fmt(inr,signed){
  const v=toDisp(+inr||0);
  const s=Math.abs(v).toLocaleString(isUSD()?'en-US':'en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const sign=v<-0.004?'−':(signed&&v>0.004?'+':'');
  return sign+sym()+s;
}
const inVal=inr=>(inr===''||inr==null)?'':r2(toDisp(+inr));
const accById=id=>S.accounts.find(a=>a.id===id);
function lockedFor(id){let t=0;for(const m of S.matches)if(m.status==='placed')for(const b of m.bets)if(b.accountId===id&&b.status!=='void')t+=b.stake;return t}
/* an account is risky if a bookie voided one of its bets (not a whole-match void), or you flagged it */
function riskOf(id){
  const out=[];
  for(const m of S.matches)for(const b of m.bets||[])if(b.accountId===id&&(b.bookieVoid||(b.status==='void'&&m.status!=='void')))out.push(m);
  return out;
}
/* a.risk: 'risky' or 'safe' set by you; otherwise risky = had a bookie void (old a.flagged counts as 'risky') */
const autoRisky=id=>riskOf(id).length>0;
function accRisky(id){const a=accById(id);if(!a)return false;const o=a.risk||(a.flagged?'risky':null);return o?o==='risky':autoRisky(id)}
function riskBadge(id){
  const a=accById(id);if(!a)return '';
  const r=riskOf(id),risky=accRisky(id),manual=a.risk||(a.flagged?'risky':null);
  const why=(r.length?`Bet voided by the bookie on: ${r.map(m=>teamName(m,'A')+' vs '+teamName(m,'B')).join(', ')}. `:'')+(manual?`Set to ${manual} by you. `:'')+`Click to mark ${risky?'safe':'risky'}.`;
  return ` <button class="pill risk ${risky?'bad':'safe'}" data-act="risk-toggle" data-id="${a.id}" title="${esc(why)}">${risky?`⚠ Risky${r.length?` · ${r.length} voided`:''}`:'Safe'}</button>`;
}
const liveStake=m=>m.bets.reduce((t,b)=>t+(b.status==='void'?0:b.stake),0);
function betStatus(m,b){
  if(b.status&&b.status!=='open')return b.status;
  if(m.status==='settled')return b.side===m.winner?'won':'lost';
  if(m.status==='void')return 'void';
  return 'open';
}
function betCell(m,b,i){
  if(!b)return '<td></td>';
  const a=accById(b.accountId),s=betStatus(m,b);
  const pill={open:'<span class="pill lock">Open</span>',void:'<span class="pill muted">Void · refunded</span>',
    won:`<span class="pill ok">Won ${fmt(b.stake*b.odds)}</span>`,lost:'<span class="pill bad">Lost</span>'}[s];
  const live=s==='open'&&m.status==='placed';
  if(live&&editingBet===m.id+':'+i)return `<td><div class="bet-cell bet-edit"><b>${esc(a?a.name:b.accountName)}</b>
    <span class="cur-in"><em>${sym()}</em><input type="number" step="0.01" min="0" id="be-s-${m.id}-${i}" value="${inVal(b.stake)}" aria-label="Stake"></span>

/* every account on its team's column; live bets first, voided ones last */
function sideTable(m){

const teamName=(m,side)=>(side==='A'?m.teamA:m.teamB)||(side==='A'?'Team A':'Team B');
function fmtTime(t){if(!t)return 'No start time';const d=new Date(t);return isNaN(d)?t:d.toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

/* ---------- arbitrage maths ---------- */
function stakes(m){
  const a=+m.oddsA,b=+m.oddsB,max=+m.maxBet;
  if(!(a>1&&b>1&&max>0))return null;
  const lowA=a<=b, oLow=Math.min(a,b), oHigh=Math.max(a,b);
  const sLow=r2(max), sHigh=r2(max*oLow/oHigh);
  const sugA=lowA?sLow:sHigh, sugB=lowA?sHigh:sLow;
  let stakeA=sugA, stakeB=sugB, custom=false;
  const cA=+m.customA, cB=+m.customB;
  if(cA>0&&cB>0){stakeA=r2(cA);stakeB=r2(cB);custom=true}
  return Object.assign(outcome(stakeA,stakeB,a,b),{sugA,sugB,custom,max,isArb:1/a+1/b<1,margin:1/a+1/b,lowSide:lowA?'A':'B'});
}
function outcome(stakeA,stakeB,a,b){
  const total=stakeA+stakeB, retA=stakeA*a, retB=stakeB*b;
  const profitA=retA-total, profitB=retB-total, profit=Math.min(profitA,profitB);
  return{stakeA,stakeB,total,retA,retB,ret:Math.min(retA,retB),profitA,profitB,profit,roi:profit/total,bigSide:stakeA>=stakeB?'A':'B'};
}
/* round-number stake pairs that keep both outcomes as profitable as possible */
function roundOptions(m){
  const st=stakes(m);if(!st||!st.isArb)return[];
  const a=+m.oddsA,b=+m.oddsB,lowA=st.lowSide==='A';
  const oLow=Math.min(a,b),oHigh=Math.max(a,b);
  const steps=isUSD()?[0.5,1,5]:[10,50,100];
  const out=[],seen=new Set();
  for(const sd of steps){
    const R=fromDisp(sd);
    const topBig=Math.floor(st.max/R+1e-9);
    let best=null;
    for(let i=0;i<3;i++){
      const big=(topBig-i)*R;if(big<=0)break;
      const ideal=big*oLow/oHigh, base=Math.floor(ideal/R);
      for(let j=-1;j<=2;j++){
        const small=(base+j)*R;if(small<=0)continue;
        const sA=r2(lowA?big:small), sB=r2(lowA?small:big);
        const o=outcome(sA,sB,a,b);
        if(!best||o.profit>best.profit+1e-9)best=o;
      }
    }
    if(best&&best.profit>0){const k=best.stakeA+'/'+best.stakeB;if(!seen.has(k)){seen.add(k);out.push(Object.assign(best,{step:sd}))}}
  }
  return out;
}

/* ---------- planner ---------- */
/* n = {A:count,B:count} bets to place; pool = accounts allowed to bet; any account can send money */
/* Safe accounts pair only with safe ones and risky only with risky, so a voided risky bet
   can never break a safe pair. Cover bets use leftover safe accounts first. */
let riskySet=new Set();
const isRisky=id=>riskySet.has(id);
/* pref = {accountId: side} from the previous plan, so placing one bet doesn't reshuffle the rest */
function groupPick(bal,pool,n,big,pref={}){
  const out=[],used=new Set();
  const order=list=>list.sort((x,y)=>((pref[y]===n.coverSide)-(pref[x]===n.coverSide))||(bal[y]-bal[x]));
  // covers first, from the same group as the bets they balance (safe covers safe, risky covers risky)
  const take=(wantRisky,k)=>{
    const mine=order(pool.filter(id=>!used.has(id)&&isRisky(id)===wantRisky));
    const other=order(pool.filter(id=>!used.has(id)&&isRisky(id)!==wantRisky));
    for(const id of mine.concat(other).slice(0,k)){used.add(id);out.push({accountId:id,side:n.coverSide,group:'cover'})}
  };
  take(false,n.Cs||0);take(true,n.C-(n.Cs||0));
  if(out.length<n.C)return null;
  const byPref=(x,y)=>(!!pref[y]-!!pref[x])||(bal[y]-bal[x]);
  const left=pool.filter(id=>!used.has(id));
  const safe=left.filter(id=>!isRisky(id)).sort(byPref), risky=left.filter(isRisky).sort(byPref);
  const Ps=Math.min(n.P,Math.floor(safe.length/2)), Pr=n.P-Ps;
  if(Pr>Math.floor(risky.length/2))return null;
  const small=big==='A'?'B':'A';
  const pairs=(list,k,group)=>{
    const pick=list.slice(0,2*k).sort((x,y)=>bal[y]-bal[x]);
    // accounts keep the side they had in the last plan; new ones fill the gaps (richest on the big side)
    const B=pick.filter(id=>pref[id]===big).slice(0,k), Sm=pick.filter(id=>pref[id]===small).slice(0,k);
    const rest=pick.filter(id=>!B.includes(id)&&!Sm.includes(id));
    while(B.length<k)B.push(rest.shift());
    while(Sm.length<k)Sm.push(rest.shift());
    B.forEach(id=>out.push({accountId:id,side:big,group}));Sm.forEach(id=>out.push({accountId:id,side:small,group}));
  };
  pairs(safe,Ps,'safe');pairs(risky,Pr,'risky');
  return out;
}
function tryAssign(bal,n,st,fee,pool,ids,pref){
  // keep the last plan's choices when the money allows it, else plan from scratch
  if(pref){const k=assignWith(bal,n,st,fee,pool,ids,pref);if(!k.fail)return k}
  return assignWith(bal,n,st,fee,pool,ids,{});
}
function assignWith(bal,n,st,fee,pool,ids,pref){
  const picks=groupPick(bal,pool,n,st.bigSide,pref);
  if(!picks)return{fail:'accounts'};
  const stakeOf=s=>s==='A'?st.stakeA:st.stakeB;
  const assign=picks.map(x=>({...x,stake:stakeOf(x.side)}));
  const need={};assign.forEach(x=>need[x.accountId]=x.stake);
  const deficits=[],surplus=[];
  for(const id of ids){const s=bal[id]-(need[id]||0);if(s< -0.004)deficits.push({id,amt:ceil2(-s)});else if(s>0.004)surplus.push({id,amt:s})}
  deficits.sort((x,y)=>y.amt-x.amt);
  const transfers=[];
  const min=minXfer();
  for(const d of deficits){
    let left=d.amt;
    while(left>0.004){
      // one sender for the whole amount if possible (smallest that fits), else the richest.
      // Every transfer must be at least the minimum, so a small top-up sends the minimum instead.
      const want=Math.max(left,min);
      const fits=surplus.filter(s=>s.amt-fee>=want-0.004).sort((x,y)=>x.amt-y.amt);
      surplus.sort((x,y)=>y.amt-x.amt);
      const donor=fits[0]||surplus.find(s=>s.amt-fee>=Math.max(min,0.005));
      if(!donor)return{fail:'money'};
      const amt=r2(Math.max(Math.min(left,donor.amt-fee),min));
      if(amt<=0)return{fail:'money'};
      transfers.push({from:donor.id,to:d.id,amount:amt});
      donor.amt-=amt+fee;left=Math.max(0,r2(left-amt));
    }
  }
  const nb={...bal};
  for(const t of transfers){nb[t.from]-=t.amount+fee;nb[t.to]+=t.amount}
  for(const x of assign)nb[x.accountId]-=x.stake;
  return{bets:assign,transfers,newBal:nb};
}
const liveBets=m=>m.bets.filter(b=>betStatus(m,b)==='open');
/* stakes for adding bets to a match that already has some: copy what was placed */
function placedStakes(m){
  const any=side=>m.bets.find(b=>b.side===side);
  const base=stakes(m);
  const a=any('A'),b=any('B');
  const sA=a?a.stake:base&&base.stakeA, sB=b?b.stake:base&&base.stakeB;
  const oA=a?a.odds:+m.oddsA, oB=b?b.odds:+m.oddsB;
  if(!(sA>0&&sB>0&&oA>1&&oB>1))return null;
  return Object.assign(outcome(sA,sB,oA,oB),{oddsA:oA,oddsB:oB});
}
function plan(){
  const fee=feeInr();
  const ids=S.accounts.map(a=>a.id);
  let bal={};S.accounts.forEach(a=>bal[a.id]=Math.max(0,+a.balance||0));
  const todo=S.matches.filter(m=>m.status==='draft'||m.status==='placed').map((m,i)=>({m,i})).sort((x,y)=>{
    const tx=x.m.time||'~',ty=y.m.time||'~';return tx<ty?-1:tx>ty?1:x.i-y.i}).map(x=>x.m);
  const out=[];
  riskySet=new Set(S.accounts.filter(a=>accRisky(a.id)).map(a=>a.id));
  for(const m of todo){
    const skip=new Set(m.skip||[]);
    const placed=m.status==='placed';
    const live=placed?liveBets(m):[];
    const busy=new Set(live.map(b=>b.accountId));
    const free=ids.filter(id=>!skip.has(id)&&!busy.has(id));
    const pool=m.noRisky?free.filter(id=>!isRisky(id)):free;
    const riskyOut=m.noRisky?free.length-pool.length:0;
    const st=placed?placedStakes(m):stakes(m);
    const nA=live.filter(b=>b.side==='A').length, nB=live.length-nA;
    const coverSide=nA>nB?'B':'A', gap=Math.abs(nA-nB);
    const reqC=Math.min(gap,pool.length);
    // how many of the unhedged bets are on safe accounts: those get safe covers
    const sd=live.filter(b=>!isRisky(b.accountId)).reduce((t,b)=>t+(b.side===coverSide?-1:1),0);
    const n=(C,P)=>({C,P,coverSide,Cs:Math.min(C,Math.max(0,sd))});
    const maxP=C=>{for(let P=Math.floor((pool.length-C)/2);P>0;P--)if(groupPick(bal,pool,n(C,P),'A'))return P;return 0};
    const req=maxP(reqC);
    const base={m,st,placed,skip:[...skip],coverSide,gap,reqC,req,liveA:nA,liveB:nB,riskyOut,noRisky:!!m.noRisky};
    if(!st||(!placed&&!req)){out.push({...base,C:0,P:0,bets:[],transfers:[],reason:!st?'incomplete':'accounts'});continue}
    if(placed&&!reqC&&!req){if(gap)out.push({...base,C:0,P:0,bets:[],transfers:[],reason:'nocover'});continue}
    const prev=planCache.rows.find(x=>x.m.id===m.id),pref={};
    if(prev)for(const x of prev.bets||[])pref[x.accountId]=x.side;
    let res=null;
    outer:for(let C=reqC;C>=0;C--)for(let P=maxP(C);P>=0;P--){
      if(C+P===0)continue;
      const r=tryAssign(bal,n(C,P),st,fee,pool,ids,pref);if(!r.fail){res={...r,C,P};break outer}}
    const full=res&&res.C===reqC&&res.P===req;
    const need=full?null:shortfall(bal,n(reqC,req),st,fee,pool,ids);
    const off=res?res.bets.filter(x=>isUnticked(m,x.accountId)):[];
    if(res&&(Array.isArray(m.xfers)||off.length)){
      // the user's own transfers replace the suggested ones; unticked bets are not paid for
      const nb={...bal};
      if(Array.isArray(m.xfers)){res.suggested=res.transfers;res.transfers=m.xfers.filter(t=>accById(t.from)&&accById(t.to)&&t.amount>0);res.custom=true}
      for(const t of res.transfers){nb[t.from]-=t.amount+fee-extraOf(t);nb[t.to]+=t.amount}
      for(const x of res.bets)if(!off.includes(x))nb[x.accountId]-=x.stake;
      res.newBal=nb;
      res.neg=ids.filter(id=>nb[id]< -0.004).map(id=>({id,amt:-nb[id]}));
    }
    if(res){bal=res.newBal;out.push({...base,...res,need})}
    else out.push({...base,C:0,P:0,bets:[],transfers:[],need});
  }
  return{rows:out,left:bal};
}
/* smallest deposit (into the richest account) that covers every wanted bet */
function shortfall(bal,n,st,fee,pool,ids){
  const to=[...ids].sort((x,y)=>bal[y]-bal[x])[0];
  const ok=x=>!tryAssign({...bal,[to]:bal[to]+x},n,st,fee,pool,ids).fail;
  const k=2*n.P+n.C;
  let lo=0,hi=n.P*st.total+n.C*Math.max(st.stakeA,st.stakeB)+fee*k+1;
  for(let i=0;i<5&&!ok(hi);i++)hi*=2;
  if(!ok(hi))return null;
  for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(ok(mid))hi=mid;else lo=mid}
  return{amt:Math.ceil(hi),to};
}

function calcHTML(m){
  const st=stakes(m);
  if(!st)return `<p class="muted" style="margin:0">Enter both odds (decimal, like 2.4) and the max bet per side to see the stakes.</p>`;
  const pr=lastPlan.find(r=>r.m.id===m.id);
  const P=pr?pr.P:0, maxP=pr?pr.req:Math.floor(S.accounts.length/2);
  let warn='';
  if(!st.isArb)warn=`<div class="note bad">No arbitrage at these odds: 1/${m.oddsA} + 1/${m.oddsB} = ${st.margin.toFixed(3)}, which is 1 or more. You would lose ${fmt(-st.profit)} per pair.</div>`;
  let fund='';
  if(pr&&m.status==='draft'){
    if(maxP===0)fund=`<span class="pill bad">Add at least 2 accounts on the Money tab</span>`;
    else if(P>=maxP)fund=`<span class="pill ok">Betting from all ${maxP} pair${maxP>1?'s':''}</span>`;
    else fund=`<span class="pill bad">Betting from ${P} of ${maxP} pairs${pr.need?` · add ${fmt(pr.need.amt)} for all`:''}</span>`;
  }
  if(st.custom){
    if(Math.max(st.stakeA,st.stakeB)>st.max+0.005)warn+=`<div class="note warn">One of your stakes is above the max bet of ${fmt(st.max)}. The bookie may not accept it.</div>`;
    for(const s of ['A','B']){const p=s==='A'?st.profitA:st.profitB;if(p<0)warn+=`<div class="note bad">With your stakes you lose ${fmt(-p)} per pair if ${esc(teamName(m,s))} wins.</div>`}
  }
  const tagFor=s=>st.custom?`your stake · suggested ${fmt(s==='A'?st.sugA:st.sugB)}`:(st.lowSide===s?'max side':'other side');
  const even=Math.abs(st.profitA-st.profitB)<1;
  const opts=m.status==='draft'?roundOptions(m):[];
  const pk=(o)=>`${o.stakeA}/${o.stakeB}`, cur=`${st.stakeA}/${st.stakeB}`;
  const chips=opts.length?`<div class="chips"><span class="muted" style="font-size:13px">Round numbers:</span>${opts.map(o=>`<button class="chip${st.custom&&pk(o)===cur?' on':''}" data-act="round" data-id="${m.id}" data-a="${o.stakeA}" data-b="${o.stakeB}">${fmt(o.stakeA)} / ${fmt(o.stakeB)} <span>worst case ${fmt(o.profit,true)}</span></button>`).join('')}${st.custom?`<button class="chip" data-act="clear-custom" data-id="${m.id}">Exact (${fmt(st.sugA)} / ${fmt(st.sugB)})</button>`:''}</div>`:'';
  return `${warn}
  <div class="stakes">
    <div class="stake"><small>Bet on ${esc(teamName(m,'A'))} @ ${esc(m.oddsA)}</small><b>${fmt(st.stakeA)}</b> <span class="tag">${tagFor('A')}</span></div>
    <div class="stake"><small>Bet on ${esc(teamName(m,'B'))} @ ${esc(m.oddsB)}</small><b>${fmt(st.stakeB)}</b> <span class="tag">${tagFor('B')}</span></div>
  </div>
  ${chips}
  <div class="kv">
    <div><span>Per pair: stake </span><b>${fmt(st.total)}</b></div>
    ${even?`<div><span>returns </span><b>${fmt(st.ret)}</b></div><div><span>profit </span><b class="${st.profit>=0?'g':'x'}">${fmt(st.profit,true)} (${(st.roi*100).toFixed(1)}%)</b></div>`
    :`<div><span>if ${esc(teamName(m,'A'))} wins </span><b class="${st.profitA>=0?'g':'x'}">${fmt(st.profitA,true)}</b></div><div><span>if ${esc(teamName(m,'B'))} wins </span><b class="${st.profitB>=0?'g':'x'}">${fmt(st.profitB,true)}</b></div>`}
  </div>
  <div class="kv">${P>0?`<div><span>× ${P} pair${P>1?'s':''}: stake </span><b>${fmt(st.total*P)}</b></div><div><span>${even?'profit':'worst-case profit'} </span><b class="${st.profit>=0?'g':'x'}">${fmt(st.profit*P,true)}</b></div><div><span>uses </span><b>${2*P} accounts</b></div>`:''} ${fund}</div>`;
}

function renderMatches(){

  }</tbody></table></div></details>`:''}`;

function renderPlanner(){
  const el=document.getElementById('tab-planner');
  const {rows,left}=planCache;

    const m=r.m;

    const head=`${r.placed?'<span class="pill lock">Already placed</span> ':''}${esc(m.name)}: ${title}`;
    const skipped=r.skip.length?`<div class="chips"><span class="muted" style="font-size:13px">Can't place from:</span>${r.skip.map(id=>`<button class="chip" data-act="unskip" data-id="${m.id}" data-acc="${id}" title="Put this account back">${esc(accById(id)?.name||'?')} ✕</button>`).join('')}</div>`:'';
    if(r.reason==='incomplete')return `<div class="card plan"><h3>${head}</h3><div class="muted">Fill in both odds and the max bet on the Matches tab first.</div></div>`;
    if(r.reason==='accounts')return `<div class="card plan"><h3>${head}</h3><div class="muted">Not enough accounts left. Each pair is two accounts betting on opposite teams.</div>${skipped}${r.noRisky?`<div class="chips"><button class="chip on" data-act="norisky" data-id="${m.id}">Risky accounts left out · use them again</button></div>`:''}</div>`;
    if(r.reason==='nocover')return `<div class="card plan"><h3>${head}</h3><div class="note bad">${r.gap} bet${r.gap>1?'s':''} on ${esc(teamName(m,r.coverSide==='A'?'B':'A'))} ${r.gap>1?'have':'has'} no cover, and every account is already on this match or marked as can't place.</div>${skipped}${r.noRisky?`<div class="chips"><button class="chip on" data-act="norisky" data-id="${m.id}">Risky accounts left out · use them again</button></div>`:''}</div>`;
    const want=[r.reqC?`cover ${r.reqC} unhedged bet${r.reqC>1?'s':''}`:'',r.req?`bet from ${r.req} ${r.placed?'more ':''}pair${r.req>1?'s':''}`:''].filter(Boolean).join(' and ');
    const addTxt=r.need?`Add <b class="num">${fmt(r.need.amt)}</b> to ${esc(accById(r.need.to)?.name||'an account')} to ${want}.`:'';
    const got=[r.C?(r.C===r.reqC?`the cover bet${r.C>1?'s':''}`:`${r.C} of ${r.reqC} cover bets`):'',r.P?`${r.P} of ${r.req} pair${r.req>1?'s':''}`:''].filter(Boolean).join(' and ');
    const short=(r.C<r.reqC||r.P<r.req)?`<div class="note ${r.C+r.P?'warn':'bad'}">${r.C+r.P?`Free money covers ${got}.`:`Not enough free money${i>0?' after the earlier matches':''}.`} ${addTxt}</div>`:'';
    const cover=r.C?`<div class="note warn">${r.liveA} live on ${esc(teamName(m,'A'))}, ${r.liveB} on ${esc(teamName(m,'B'))}. ${r.C>1?`The ${r.C} ${esc(teamName(m,r.coverSide))} bets below cover`:`One ${esc(teamName(m,r.coverSide))} bet below covers`} the unhedged side.</div>`:'';
    if(!r.C&&!r.P)return `<div class="card plan"><h3>${head}</h3><div class="meta">${esc(fmtTime(m.time))}</div>${short}${skipped}${r.noRisky?`<div class="chips"><button class="chip on" data-act="norisky" data-id="${m.id}">Risky accounts left out · use them again</button></div>`:''}</div>`;
    const isOn=b=>!isUnticked(m,b.accountId);
    const nOn=r.bets.filter(isOn).length;
    const betRow=b=>`<tr${isOn(b)?'':' class="off"'}><td class="chk"><input type="checkbox" data-chk="${m.id}" data-acc="${b.accountId}"${isOn(b)?' checked':''} aria-label="Placed ${esc(accById(b.accountId)?.name)}'s bet"></td><td>${esc(accById(b.accountId)?.name)}${riskBadge(b.accountId)}</td><td><span class="${b.side==='A'?'side-a':''}">${esc(teamName(m,b.side))}</span> @ ${esc(b.side==='A'?(r.st.oddsA??m.oddsA):(r.st.oddsB??m.oddsB))}</td><td class="r num">${fmt(b.stake)}</td><td class="r"><div class="row-acts"><button class="btn sm pri" data-act="place-one" data-id="${m.id}" data-acc="${b.accountId}" title="Record just this bet now; the rest of the plan updates">Placed ✓</button><button class="btn sm ghost" data-act="skip" data-id="${m.id}" data-acc="${b.accountId}" title="This account can't bet on this match: pick another">Can't place</button></div></td></tr>`;
    const GROUPS={cover:['Cover bets','Even out the sides of bets already placed.'],safe:['Safe pairs','No bet has ever been voided on these accounts.'],risky:['Risky pairs','These accounts have had bets voided before, so they only pair with each other. If a bookie voids some of these, your safe pairs stay hedged.']};
    const nPairs=g=>r.bets.filter(b=>b.group===g).length/(g==='cover'?1:2);

    const nRiskyFree=r.bets.some(b=>b.group==='risky')||r.riskyOut;

    const addRow=`<li class="xf-add"><span class="muted" style="font-size:13px">Add a transfer:</span><select id="xf-from-${m.id}" aria-label="From">${opts(S.accounts.find(a=>!r.bets.some(b=>b.accountId===a.id))?.id)}</select><span class="arrow">→</span><select id="xf-to-${m.id}" aria-label="To">${opts(firstBettor)}</select><span class="cur-in xf-amt"><em>${sym()}</em><input type="number" step="0.01" min="0" inputmode="decimal" id="xf-amt-${m.id}" placeholder="amount" aria-label="Amount"></span><button class="btn sm" data-act="xf-add" data-id="${m.id}">Add</button></li>`;
    const negTot=r.neg?r.neg.reduce((t,n)=>t+n.amt,0):0;

    const profit=r.st.profit*r.P, feeTot=fee*r.transfers.length, staked=r.bets.reduce((t,b)=>t+b.stake,0);
    const ps=r.bets.filter(b=>b.group==='safe').length/2, pr=r.bets.filter(b=>b.group==='risky').length/2;
    const what=[r.C?`${r.C} cover bet${r.C>1?'s':''}`:'',ps?`${ps} safe pair${ps>1?'s':''}`:'',pr?`${pr} risky pair${pr>1?'s':''}`:''].filter(Boolean).join(' + ')+(r.P?` (${r.P} of ${r.req} ${r.placed?'new ':''}pairs)`:'');
    return `<div class="card plan">
      <div class="m-top"><div><h3>${i+1}. ${head}</h3><div class="meta">${esc(fmtTime(m.time))} · ${what} · ${fmt(staked)} staked</div></div>
      <button class="btn pri" data-act="place" data-id="${m.id}"${nOn?'':' disabled'}>${nOn===r.bets.length?'Mark bets placed':`Mark ${nOn} of ${r.bets.length} bets placed`}</button></div>
      ${cover}${nOn<r.bets.length&&nOn?`<div class="note warn">${r.bets.length-nOn} bet${r.bets.length-nOn>1?'s':''} unticked. Only the ticked ones get recorded; if that leaves one side short, the planner will suggest a cover bet next.</div>`:''}${short}
      <div><div class="muted" style="font-size:13px;margin-bottom:6px">1. Make these transfers first${r.transfers.length?` (${r.transfers.length} to do${done.length?`, ${done.length} done`:''})`:done.length?` (${done.length} done)`:''}. Tick each one once you've sent it: the money moves on the Money tab straight away.</div>${xf}</div>
      <div><div class="muted" style="font-size:13px;margin-bottom:6px">2. Then place these bets. Press Placed ✓ on each bet as you place it: it's recorded straight away (with its transfers) and the rest of the plan updates. Or place them all, untick any you didn't place, and press Mark bets placed. If an account can't bet on this match at all, press Can't place and the plan picks another account.</div>
      <div class="tbl-wrap card"><table><thead><tr><th class="chk"><input type="checkbox" data-chk-all="${m.id}"${nOn===r.bets.length?' checked':''} aria-label="Tick all"></th><th>Account</th><th>Bet on</th><th class="r">Stake</th><th></th></tr></thead><tbody>${bets}</tbody></table></div></div>
      ${skipped}${riskyToggle}
      ${r.P?`<div class="kv"><div><span>Locked-in profit from new pairs </span><b class="${profit>=0?'g':'x'}">${fmt(profit,true)}</b></div><div><span>fees </span><b>${fmt(feeTot)}</b></div><div><span>net </span><b class="${profit-feeTot>=0?'g':'x'}">${fmt(profit-feeTot,true)}</b></div></div>`:`<div class="kv"><div><span>fees </span><b>${fmt(feeTot)}</b></div></div>`}
    </div>`}).join('');

function markDirty(){dirty=true;renderSaveState()}

document.addEventListener('input',e=>{
  const t=e.target;

    const a=accById(t.dataset.acc);if(!a)return;

  }else if(t.dataset.set){

});
function xfersOf(m){
  if(!Array.isArray(m.xfers)){const r=lastPlan.find(x=>x.m.id===m.id);m.xfers=(r?r.transfers:[]).map(t=>({from:t.from,to:t.to,amount:t.amount}))}
  return m.xfers;
}

document.addEventListener('change',e=>{

    const mid=t.dataset.chk||t.dataset.chkAll,y=scrollY;

function confirmTwice(btn,key,label){
  if(armed===key){armed=null;clearTimeout(armTimer);return true}
  document.querySelectorAll('.btn.armed').forEach(b=>{b.classList.remove('armed');if(b.dataset.orig)b.textContent=b.dataset.orig});
  armed=key;btn.dataset.orig=btn.textContent;btn.textContent=label;btn.classList.add('armed');
  clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;btn.classList.remove('armed');btn.textContent=btn.dataset.orig},4000);
  return false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  const y=scrollY;
  if(act==='cur'){S.settings.currency=b.dataset.v;markDirty();renderAll();scrollTo(0,y);return}
  if(act==='save'){save();return}
  if(act==='add-acc'){S.accounts.push({id:uid(),name:'',balance:0});markDirty();renderAll();const last=S.accounts[S.accounts.length-1];document.getElementById('acc-n-'+last.id)?.focus();return}
  if(act==='del-acc'){
    const a=accById(id);if(!a)return;
    if(lockedFor(id)>0){b.textContent='Has money in bets';setTimeout(()=>b.textContent='Delete',2500);return}
    if(!confirmTwice(b,'del-acc-'+id,'Click again to delete'))return;
    S.accounts=S.accounts.filter(x=>x.id!==id);addLog(`Deleted account ${a.name||'(unnamed)'}`);markDirty();renderAll();scrollTo(0,y);return}
  if(act==='add-match'){S.matchSeq=(S.matchSeq||S.matches.length)+1;const m=newMatch(S.matchSeq);S.matches.push(m);markDirty();renderAll();document.getElementById('m-ta-'+m.id)?.scrollIntoView({block:'center'});document.getElementById('m-ta-'+m.id)?.focus();return}
  if(act==='del-match'){if(!confirmTwice(b,'del-m-'+id,'Click again to delete'))return;S.matches=S.matches.filter(x=>x.id!==id);markDirty();renderAll();scrollTo(0,y);return}
  if(act==='place'){
    const r=lastPlan.find(x=>x.m.id===id);if(!r||!r.bets.length)return;
    const chosen=r.bets.filter(x=>!isUnticked(r.m,x.accountId));if(!chosen.length)return;
    const neg=r.neg||[],extra=neg.reduce((t,n)=>t+n.amt,0);
    if(!confirmTwice(b,'place-'+id,neg.length?`Yes, they had ${fmt(extra)} extra: place`:`Confirm: ${r.transfers.length} transfer${r.transfers.length===1?'':'s'}, ${chosen.length} bets`))return;
    const fee=feeInr(),m=r.m;
    for(const n of neg){const a=accById(n.id);if(!a)continue;a.balance=r2(a.balance+n.amt);addLog(`Found ${fmt(n.amt)} extra in ${a.name} (not tracked before)`)}
    for(const t of r.transfers)sendXfer(t,fee);
    for(const x of chosen){const a=accById(x.accountId);a.balance=r2(a.balance-x.stake)}
    for(const n of neg){const a=accById(n.id);if(a&&a.balance<0&&a.balance>-0.02)a.balance=0}
    const odds=side=>side==='A'?(r.st.oddsA??+m.oddsA):(r.st.oddsB??+m.oddsB);
    const added=chosen.map(x=>({accountId:x.accountId,accountName:accById(x.accountId).name,side:x.side,stake:x.stake,odds:odds(x.side),status:'open'}));
    delete m.xfers;
    const was=m.status==='placed';
    m.bets=was?m.bets.concat(added):added;
    if(!was){m.status='placed';m.placedAt=new Date().toISOString()}
    const cA=chosen.filter(x=>x.side==='A').length,cB=chosen.length-cA;
    addLog(`${was?'Added':'Placed'} ${chosen.length} bet${chosen.length>1?'s':''} on ${teamName(m,'A')} vs ${teamName(m,'B')} (${cA} on ${teamName(m,'A')}, ${cB} on ${teamName(m,'B')}; ${fmt(chosen.reduce((t,x)=>t+x.stake,0))} staked, ${r.transfers.length} transfers)${chosen.length<r.bets.length?`, ${r.bets.length-chosen.length} unticked`:''}`);
    delete m.unticked;delete m.doneXfers;
    renderAll();scrollTo(0,y);save();return}
  if(act==='xf-earned'){
    const m=S.matches.find(x=>x.id===id);const t=m&&Array.isArray(m.xfers)&&m.xfers[+b.dataset.i];if(!t)return;
    t.earned=t.earned===false;markDirty();renderAll();scrollTo(0,y);save();return}
  if(act==='xf-done'||act==='xf-undo'){
    const m=S.matches.find(x=>x.id===id);if(!m)return;const k=+b.dataset.i,fee=feeInr();
    if(act==='xf-done'){
      const r=lastPlan.find(x=>x.m.id===id);const t=r&&r.transfers[k];if(!t){b.checked=false;return}
      const extra=sendXfer(t,fee);
      m.doneXfers=(m.doneXfers||[]).concat([{from:t.from,to:t.to,amount:t.amount,fee,extra,base:t.base,earned:t.earned,custom:Array.isArray(m.xfers),at:new Date().toISOString()}]);
      if(Array.isArray(m.xfers)){const i=m.xfers.findIndex(x=>x.from===t.from&&x.to===t.to&&Math.abs(x.amount-t.amount)<0.005);if(i>=0)m.xfers.splice(i,1)}
    }else{
      const t=(m.doneXfers||[])[k];if(!t)return;
      const f=accById(t.from),to=accById(t.to);
      if(to&&(+to.balance||0)<t.amount-0.004){b.checked=true;const li=b.closest('li');li.querySelector('.pill').textContent=`Can't undo: ${to.name} already used it`;return}
      if(f)f.balance=r2(f.balance+t.amount+t.fee-(t.extra||0));if(to)to.balance=r2(to.balance-t.amount);S.feesPaid=r2(Math.max(0,(S.feesPaid||0)-t.fee));
      m.doneXfers.splice(k,1);
      if(Array.isArray(m.xfers))m.xfers.push({from:t.from,to:t.to,amount:t.amount,...(t.base!=null?{base:t.base,earned:t.earned}:{})});
      addLog(`Undid transfer of ${fmt(t.amount)} from ${f?f.name:'?'} to ${to?to.name:'?'}`);
    }
    renderAll();scrollTo(0,y);save();return}
  if(act==='place-one'){
    const r=lastPlan.find(x=>x.m.id===id);const acc=b.dataset.acc;const x=r&&r.bets.find(q=>q.accountId===acc);if(!x)return;
    const fee=feeInr(),m=r.m,a=accById(acc);if(!a)return;
    const incoming=r.transfers.filter(t=>t.to===acc);
    // who would go below zero if we do only this bet and its transfers now
    const after={};const add=(id,v)=>after[id]=(after[id]??(+accById(id)?.balance||0))+v;
    for(const t of incoming){add(t.from,-(t.amount+fee)+extraOf(t));add(t.to,t.amount)}
    add(acc,-x.stake);
    const neg=Object.entries(after).filter(([,v])=>v< -0.004).map(([id,v])=>({id,amt:r2(-v)})),extra=neg.reduce((t,n)=>t+n.amt,0);

    if(!confirmTwice(b,'p1-'+id+acc,lbl))return;
    for(const n of neg){const q=accById(n.id);q.balance=r2(q.balance+n.amt);addLog(`Found ${fmt(n.amt)} extra in ${q.name} (not tracked before)`)}
    for(const t of incoming)sendXfer(t,fee);

    m.bets=(m.bets||[]).concat([{accountId:acc,accountName:a.name,side:x.side,stake:x.stake,odds,status:'open'}]);
    if(m.status!=='placed'){m.status='placed';m.placedAt=new Date().toISOString()}
    addLog(`Placed ${a.name} on ${teamName(m,x.side)}: ${fmt(x.stake)} @ ${odds} (${teamName(m,'A')} vs ${teamName(m,'B')})`);
    renderAll();scrollTo(0,y);save();return}
  if(act==='quick-acc'){
    const n=document.getElementById('qa-name'),v=document.getElementById('qa-bal');
    const name=n.value.trim();if(!name){n.focus();return}
    S.accounts.push({id:uid(),name,balance:v.value===''?0:r2(fromDisp(+v.value))});
    addLog(`Added account ${name}`);renderAll();scrollTo(0,y);save();return}
  if(act==='xf-del'||act==='xf-add'||act==='xf-reset'){
    const m=S.matches.find(x=>x.id===id);if(!m)return;
    if(act==='xf-reset')delete m.xfers;
    else if(act==='xf-del')xfersOf(m).splice(+b.dataset.i,1);
    else{
      const from=document.getElementById('xf-from-'+id).value,to=document.getElementById('xf-to-'+id).value,v=+document.getElementById('xf-amt-'+id).value;
      const tooLow=minXfer()>0&&fromDisp(v)<minXfer()-0.004;
      if(from===to||!(v>0)||tooLow){const t=b.textContent;b.textContent=from===to?'Pick two accounts':tooLow?`Minimum is ${fmt(minXfer())}`:'Enter an amount';setTimeout(()=>b.textContent=t,2000);return}

    }
    markDirty();renderAll();scrollTo(0,y);return}
  if(act==='norisky'){const m=S.matches.find(x=>x.id===id);if(!m)return;m.noRisky=!m.noRisky;markDirty();renderAll();scrollTo(0,y);return}
  if(act==='risk-toggle'){const a=accById(id);if(!a)return;const now=accRisky(id);delete a.flagged;

    markDirty();renderAll();scrollTo(0,y);return}
  if(act==='settle'||act==='void'){
    const m=S.matches.find(x=>x.id===id);if(!m)return;

    if(!confirmTwice(b,act+'-'+id+(side||''),'Click again to confirm'))return;
    let staked=0,paid=0;
    for(const x of m.bets){if(x.status==='void')continue;staked+=x.stake;const a=accById(x.accountId);
      const back=act==='void'?x.stake:(x.side===side?x.stake*x.odds:0);paid+=back;if(a&&back)a.balance=r2(a.balance+back);
      x.status=act==='void'?'void':(x.side===side?'won':'lost')}

    const a=accById(x.accountId);if(a)a.balance=r2(a.balance+x.stake);
    m.bets.splice(i,1);if(editingBet&&editingBet.startsWith(id+':'))editingBet=null;
    addLog(`Removed ${a?a.name:x.accountName}'s bet on ${teamName(m,x.side)} (entered by mistake): ${fmt(x.stake)} refunded`);
    if(!m.bets.length){m.status='draft';delete m.placedAt}
    renderAll();scrollTo(0,y);save();return}
  if(act==='bet-prefill'){
    const id2=id;document.getElementById('ba-side-'+id2).value=b.dataset.side;
    document.getElementById('ba-stake-'+id2).value=inVal(+b.dataset.stake);document.getElementById('ba-odds-'+id2).value=b.dataset.odds;
    const acc=document.getElementById('ba-acc-'+id2);const m=S.matches.find(x=>x.id===id2);
    const free=S.accounts.filter(a=>!(m.bets||[]).some(q=>q.accountId===a.id&&q.status==='open')).sort((p,q)=>(q.balance||0)-(p.balance||0))[0];
    if(free)acc.value=free.id;
    document.getElementById('ba-stake-'+id2).focus();return}
  if(act==='bfilter'){betFilter=b.dataset.v;renderBets();return}
  if(act==='round'||act==='clear-custom'){
    const m=S.matches.find(x=>x.id===id);if(!m)return;
    if(act==='round'){m.customA=+b.dataset.a;m.customB=+b.dataset.b}else{m.customA='';m.customB=''}
    markDirty();renderAll();scrollTo(0,y);return}
  if(act==='load-remote'){serverRev=pendingRemote.rev||null;S=normalize(clone(pendingRemote));pendingRemote=null;dirty=false;notes.err=null;renderAll();return}
  if(act==='keep-mine'){serverRev=pendingRemote.rev||null;pendingRemote=null;notes.err=null;markDirty();renderNotes();return}
});

/* ---------- saving ---------- */
async function save(){
  if(saving){saveAgain=true;return}
  saving=true;
  S.rev=uid()+Date.now();S.savedAt=new Date().toISOString();
  const data=clone(S);
  renderSaveState('saving');
  try{
    if(docRef)await docRef.set(data);
    else if(mode==='server'){
      const r=await api('PUT',{state:data,baseRev:serverRev});
      if(r.status===200)serverRev=data.rev;
      else if(r.status===409){pendingRemote=r.j.state;throw{code:'conflict'}}
      else if(r.status===401){showGate();throw{message:'enter the password again'}}
      else throw{message:(r.j&&r.j.error)||('HTTP '+r.status)};
    }
    else localStorage.setItem(KEY,JSON.stringify(data));
    dirty=false;notes.err=null;pendingRemote=null;renderSaveState();
  }catch(err){
    notes.err=err&&err.code==='conflict'?'Not saved: someone else saved first. Load their version, or choose Keep mine and press Save again.':
      err&&err.code==='quota_exceeded'?'Storage is full. Delete some finished matches and save again.':
      (err&&err.code==='unavailable'?'Could not reach the server. Your changes are still here; press Save again.':'Saving failed: '+((err&&err.message)||err));
    renderSaveState('error');
  }
  renderNotes();saving=false;
  if(saveAgain){saveAgain=false;save()}
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- boot ---------- */
/* ---------- own server (Vercel /api/state) ---------- */
let serverRev=null,pw='',pollTimer=null;
try{pw=localStorage.getItem(KEY+':pw')||''}catch(_){}
async function api(method,body){
  const r=await fetch('/api/state',{method,cache:'no-store',headers:{'Content-Type':'application/json','x-app-password':pw},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(_){}
  return{status:r.status,j};
}
function applyServer(st){
  const y=scrollY;
  if(st){S=normalize(clone(st));serverRev=st.rev||null}
  dirty=false;renderAll();scrollTo(0,y);
}
async function poll(){
  if(mode!=='server'||saving||document.hidden)return;
  let r;try{r=await api('GET')}catch(_){return}
  if(r.status===401){showGate();return}
  if(r.status!==200||!r.j)return;
  const st=r.j.state;if(!st||st.rev===serverRev||st.rev===S.rev)return;
  if(dirty){pendingRemote=st;renderNotes()}else applyServer(st);
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(poll,15000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
function showGate(){document.getElementById('gate').hidden=false;setTimeout(()=>document.getElementById('gate-pw').focus(),0)}
document.getElementById('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('gate-msg');
  pw=document.getElementById('gate-pw').value;msg.textContent='Checking…';
  let r;try{r=await api('GET')}catch(_){msg.textContent='Could not reach the server. Check your connection.';return}
  if(r.status===401){msg.textContent='Wrong password. Try again.';return}
  if(r.status!==200){msg.textContent=(r.j&&r.j.error)||('Server error '+r.status);return}
  try{localStorage.setItem(KEY+':pw',pw)}catch(_){}
  document.getElementById('gate').hidden=true;msg.textContent='';
  const first=serverRev===null&&!dirty;
  if(r.j.state&&(first||r.j.state.rev!==serverRev))applyServer(r.j.state);else renderAll();
  startPolling();
});
async function serverBoot(){
  if(!/^https?:$/.test(location.protocol))return false;
  let r;try{r=await api('GET')}catch(_){return false}
  if(!r.j||r.status===404||r.status===405)return false;
  mode='server';
  if(r.status===401){renderAll();showGate();return true}
  if(r.status!==200){notes.err=r.j.error||('Server error '+r.status);renderAll();return true}
  if(r.j.state)applyServer(r.j.state);else renderAll();
  startPolling();return true;
}

async function boot(){
  readHash();renderAll();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(_){db=null}
  if(!db&&await serverBoot())return;
  if(!db){
    mode='local';
    try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw))}catch(_){}
    renderAll();return;
  }
  mode='db';docRef=db.doc(DOC);
  let confirmed=false;
  const t=setTimeout(()=>{if(!confirmed){notes.slow='Saved data can’t be reached yet. What you see may be out of date.';renderNotes()}},10000);
  docRef.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){confirmed=true;clearTimeout(t);if(notes.slow){notes.slow=null}}
    if(snap.exists){
      const d=snap.data();
      if(!(d.rev&&d.rev===S.rev)){
        if(dirty){pendingRemote=d}
        else{const y=scrollY;S=normalize(clone(d));renderAll();scrollTo(0,y);return}
      }
    }
    renderSaveState();renderNotes();
  },err=>{clearTimeout(t);notes.err='Lost connection to saved data ('+(err&&err.code||'error')+'). Reload the page to reconnect.';renderNotes()});
}
boot();

/* expose pure functions for testing */
window.__arb={stakes,tryAssign,shortfall,roundOptions,setCur:c=>{S.settings.currency=c}};
})();
</script>
